<!DOCTYPE html>
<!--

Datei kann auf grafana gehostet werden
Speichern auf Grafana Server in /usr/share/grafana/public/custom/

https://sap-ha-monitoring.bit.admin.ch/public/custom/arbeitszeitrechner.html


-->
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Arbeitszeitrechner</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    textarea, button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
    }
    .pausebutton {
      width: auto;
      padding: 3px;
    }
    .result {
      margin-top: 20px;
      font-size: 1.2em;
      font-weight: bold;
      white-space: pre-line;
    }
    .live {
      margin-top: 0px;
      font-size: 1.2em;
      color: black;
      font-weight: bold;
      display: none;
    }
    progress {
      width: 0;
      min-width: 20%;
    }

    #img-wrap {
      visibility: hidden;
      margin-top: 100px;
   position: relative;
  width: 100px;
  height: 100px;
  overflow: hidden;
}

#img-wrap img {
  position: absolute;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* Farbiges Bild (oben sichtbar) */
#color {
  z-index: 2;
  clip-path: inset( 100% 0px 0px 0px); /* obere Hälfte */
}

/* Schwarzweißes Bild (unten sichtbar) */
.bw {
  z-index: 1;
  filter: grayscale(100%);
}


  </style>
</head>
<body>

<textarea id="timeInputs" rows="8" placeholder="Beispiel:
0600
1230
1259"></textarea>
<br><br>
<button class="pausebutton" onclick="pauseHinzufuegen()">⏰30 Min Pause hinzufügen</button>
<button class="pausebutton" onclick="stempelEntfernen()">🧹Alles löschen</button>
<button class="pausebutton" onclick="berechneArbeitszeit()">🧮Berechnen</button>

<div class="result" id="ergebnis"></div>
<br><br><br>
<div class="live" id="liveArbeitszeit"></div>
<br>
<span>Progress: </span><progress id="progressbar" value="0" max="29880"> 32% </progress>

<br>
<div id="img-wrap">
  <img src="diamant.png" id="color">
  <img src="diamant.png" class="bw">
</div>


<script>
let liveInterval = null;

function stempelEntfernen() {
  document.getElementById('timeInputs').value = "";
  document.getElementById('ergebnis').innerText = "";
  hideLiveText();
}

function pauseHinzufuegen() {
  const textarea = document.getElementById('timeInputs');
  const aktuellerText = textarea.value.trim();
  textarea.value = aktuellerText
    ? aktuellerText + '\n1200\n1230'
    : '1200\n1230';
}

function parseZeiten() {
  const input = document.getElementById('timeInputs').value.trim();

  return input
    .split(/\s+/)
    .map(z => z.replace(/:/g, '').trim())
    .filter(z => /^\d{4}(\d{2})?$/.test(z))
    .map(z => {
      const h = parseInt(z.substring(0, 2), 10);
      const m = parseInt(z.substring(2, 4), 10);
      const s = z.length === 6 ? parseInt(z.substring(4, 6), 10) : 0;
      return h * 3600 + m * 60 + s;
    });
}

function berechneArbeitszeit() {
  const sekundenArray = parseZeiten();

  if (sekundenArray.length === 0) {
    document.getElementById('ergebnis').innerText =
      "Bitte gültige Uhrzeiten eingeben.";
    hideLiveText();
    return;
  }

  let totalSekunden = 0;
  for (let i = 0; i < sekundenArray.length - 1; i += 2) {
    totalSekunden += sekundenArray[i + 1] - sekundenArray[i];
  }

  const SOLL_SEKUNDEN = 8.3 * 3600;

  if (sekundenArray.length % 2 === 0) {
    hideLiveText();
    document.getElementById('ergebnis').innerText =
      `Gearbeitet: ${(totalSekunden / 3600).toFixed(2)} Stunden`;

    // Progressbar aktualisieren in gestopptem Modus
    document.getElementById("progressbar").value = totalSekunden;

    return;
  }

  startLiveUpdate(totalSekunden, sekundenArray.at(-1));

  const verbleibend = SOLL_SEKUNDEN - totalSekunden;
  if (verbleibend <= 0) {
    document.getElementById('ergebnis').innerText =
      `Ziel von 8.3 Stunden bereits erreicht (${(totalSekunden / 3600).toFixed(2)} Stunden).`;
    return;
  }

  const zielZeit = sekundenArray.at(-1) + verbleibend;
  const pad = n => n.toString().padStart(2, '0');

  document.getElementById('ergebnis').innerText =
    `Noch zu arbeiten seit letztem Stempel: ${(verbleibend / 3600).toFixed(2)} Stunden\n` +
    `Du erreichst 8.3 Stunden um: ${pad(Math.floor(zielZeit / 3600))}:` +
    `${pad(Math.floor((zielZeit % 3600) / 60))}:` +
    `${pad(Math.floor(zielZeit % 60))} Uhr`;
}

function startLiveUpdate(bisherSekunden, startSekunden) {
  hideLiveText(false);
  liveInterval = setInterval(() => {
    const now = new Date();
    const jetztSekunden =
      now.getHours() * 3600 +
      now.getMinutes() * 60 +
      now.getSeconds();

    const aktuell = bisherSekunden + (jetztSekunden - startSekunden);
    document.getElementById('liveArbeitszeit').innerText =
      `🔴LIVE: ${(aktuell / 3600).toFixed(2)} Stunden`;

    // Progressbar aktualisieren in Live Modus
    document.getElementById("progressbar").value = aktuell;

    // Diamant aktualisieren
    document.getElementById("color").style.clipPath = `inset(${100-((aktuell-29880)/3600*100).toFixed(0)}% 0px 0px 0px)`;

    // Diamant einblenden
    if (aktuell > 29880) {
      document.getElementById("img-wrap").style.visibility = "visible";
    } else {
      document.getElementById("img-wrap").style.visibility = "hidden";
    }

  }, 1000);
}

function hideLiveText(clear = true) {
  if (liveInterval) {
    clearInterval(liveInterval);
    liveInterval = null;
  }
  const live = document.getElementById('liveArbeitszeit');
  live.style.display = clear ? 'none' : 'block';
  if (clear) live.innerText = "";
}

function getURLParameter(name) {
  return new URLSearchParams(window.location.search).get(name);
}

function verarbeiteTimestampsAusURL() {
  const param = getURLParameter('timestamps');
  if (!param) return;
  document.getElementById('timeInputs').value =
    param.split(';').map(e => e.trim()).filter(Boolean).join('\n');
  berechneArbeitszeit();
}

window.addEventListener('DOMContentLoaded', verarbeiteTimestampsAusURL);
</script>

</body>
</html>
