<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Farming Apps</title>
  <script src="../theme.js"></script>
  <style>
    :root {
      --bg: #f0f2f5;
      --card: #fff;
      --border: #e4e6eb;
      --text: #1a1a2e;
      --text-secondary: #444;
      --muted: #999;
      --shadow: 0 1px 4px rgba(0,0,0,0.06);
      --tile-hover-bg: #f7f8fa;
      --tile-hover-border: #4f7fff;
      --tile-hover-shadow: 0 8px 32px rgba(79,127,255,0.10);
      --icon-bg: #f7f8fa;
    }
    [data-theme="dark"] {
      --bg: #0f1117;
      --card: #1a1d27;
      --border: #2a2d3a;
      --text: #e0e0e0;
      --text-secondary: #aaa;
      --muted: #555;
      --shadow: none;
      --tile-hover-bg: #1e2233;
      --tile-hover-border: #4f7fff;
      --tile-hover-shadow: 0 8px 32px rgba(79,127,255,0.12);
      --icon-bg: #22253a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 32px 16px;
      transition: background 0.2s, color 0.2s;
    }

    .container { max-width: 560px; margin: 0 auto; }

    header { display: flex; align-items: center; gap: 12px; margin-bottom: 32px; }
    .back-link { color: var(--muted); text-decoration: none; font-size: 0.85rem; transition: color 0.2s; }
    .back-link:hover { color: var(--text); }
    h1 { font-size: 1.5rem; font-weight: 600; color: var(--text); letter-spacing: -0.02em; }

    .app-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(96px, 1fr));
      gap: 20px;
    }
    .app {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: inherit;
      cursor: pointer;
      padding: 16px 8px;
      border-radius: 16px;
      background: var(--card);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      transition: border-color 0.2s, background 0.2s, transform 0.15s, box-shadow 0.2s;
    }
    .app:hover {
      border-color: var(--tile-hover-border);
      background: var(--tile-hover-bg);
      transform: translateY(-2px);
      box-shadow: var(--tile-hover-shadow);
    }
    .app-icon {
      width: 52px; height: 52px;
      background: var(--icon-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.5rem;
    }
    .app-name {
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--text);
      text-align: center;
      line-height: 1.3;
    }
  </style>
</head>
<body>
<div class="container">
  <header>
    <a class="back-link" href="../index.html">&#8592; Tools</a>
    <h1>Farming Apps</h1>
  </header>

  <div class="app-grid">
    <a class="app" href="../landwirtschaftssimulator/landwirtschaftssimulator.html">
      <div class="app-icon">&#128668;</div>
      <div class="app-name">Landwirtschaftssimulator</div>
    </a>
  </div>
</div>
</body>
</html>
